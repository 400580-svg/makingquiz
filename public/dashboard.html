<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — NFL Quiz Central</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <main class="auth-container">
    <section class="auth-card">
      <h1 class="auth-title">Welcome, <span id="welcome-username">…</span></h1>
      <p class="auth-subtitle">Role: <span id="welcome-role">…</span></p>
      <p class="hint" id="admin-stats" hidden></p>
      <a class="btn-primary" href="/playbooks.html" style="display:block; text-align:center; text-decoration:none; margin-bottom:12px">Playbooks</a>
      <a class="btn-primary" href="/history.html" style="display:block; text-align:center; text-decoration:none; margin-bottom:12px">My History</a>
      <button id="logout-btn" class="btn-primary">Log Out</button>
    </section>
  </main>
  <script src="/js/dashboard.js"></script>
</body>
</html>
