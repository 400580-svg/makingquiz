<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — NFL Quiz Central</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <main class="auth-container">
    <section class="auth-card">
      <h1 class="auth-title">Join the League</h1>
      <p class="auth-subtitle">Create your NFL Quiz Central account</p>

      <form id="register-form" novalidate>
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" autocomplete="username"
                 minlength="3" maxlength="50" required />
          <small class="hint">3–50 characters: letters, numbers, underscores</small>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email"
                 maxlength="100" required />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="new-password"
                 minlength="8" required />
          <small class="hint">At least 8 characters</small>
        </div>

        <div class="field">
          <label for="educator_key">Educator access key <span class="optional">(optional)</span></label>
          <input type="text" id="educator_key" name="educator_key" maxlength="32" />
          <small class="hint">Have a key from your teacher? Enter it to register as a teacher.</small>
        </div>

        <div id="error-box" class="error-box" hidden></div>

        <button type="submit" class="btn-primary">Create Account</button>
      </form>

      <p class="auth-alt">Already have an account? <a href="/login.html">Log in</a></p>
    </section>
  </main>
  <script src="/js/register.js"></script>
</body>
</html>
